# Passive HTTP / YOURLS shortlink resweep config: runtime settings, regex patterns, and seeds.

scanner:
  timeout: 45
  delay: 3.0
  retry_delay: 5.0
  min_bytes: 500
  max_runtime: 300
  data_dir: "../../data"

patterns:
  http_title: '(?i)<title[^>]*>\s*([^<\r\n]{1,160}?)\s*</title>'
  external_link: 'href=["\x27](https?://[^"\x27>\s]+)["\x27]'
  iso_date: '\b(202\d-\d{2}-\d{2})\b'
  webhook_uuid: 'webhook\.site/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'
  ntfy_topic: 'ntfy\.sh/([a-zA-Z0-9_-]{3,64})'
  tag_param: '(?:uqscan|uqframe|uqtag|uq|zz)=([a-zA-Z0-9_-]+)'
  httpbin_b64: 'httpbin\.org/base64/([A-Za-z0-9+/=]{20,})'
  agent_label: '(?i)(claude20\d{4,}|\bresearch[-_][a-z0-9]{4,}\b)'

