# urlquery.net scanner config: runtime settings, regex patterns, and broad seeds.

scanner:
  base_url: "https://api.urlquery.net/public/v1"
  api_key: "${oc.env:URLQUERY_API_KEY,''}"
  timeout: 90
  delay: 3.0
  max_runtime: 300
  max_results: 30
  since_hours: 24
  data_dir: "../../data"

patterns:
  tag_param: '(?:uqscan|uqframe|uqtag|uq|zz)=([a-zA-Z0-9_-]+)'
  cachebust: '(cachebust=1)'
  webhook_uuid: 'webhook\.site/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'
  ntfy_topic: 'ntfy\.sh/([a-zA-Z0-9_-]{3,64})'
  httpbin_b64: 'httpbin\.org/base64/([A-Za-z0-9+/=]{20,})'
  amap_surface: '(?i)\b([a-z0-9.-]*?(?:amap|gaode)\.com)\b'
  agent_label: '(?i)(claude20\d{4,}|\bresearch[-_][a-z0-9]{4,}\b)'
  via_anomaly: '(?i)via[:\s]+([^\n\r]*?(?:sandbox|ats|proxy-[a-z0-9]{4,})[^\n\r]*)'

seeds:
  - { name: uqscan_param, query: "uqscan=", tags: [harness, tag_grammar] }
  - { name: uqframe_param, query: "uqframe=", tags: [harness, tag_grammar] }
  - { name: uqtag_param, query: "uqtag=", tags: [harness, tag_grammar] }
  - { name: cachebust_param, query: "cachebust=1", tags: [harness, tag_grammar] }
  - { name: webhook_site, query: "webhook.site", tags: [exfil, webhook] }
  - { name: ntfy_sh, query: "ntfy.sh", tags: [exfil, ntfy] }
  - { name: httpbin_base64, query: "httpbin.org/base64", tags: [payload, httpbin] }
  - { name: amap_domain, query: "url.domain:amap.com", tags: [amap, surface] }
  - { name: gaode_domain, query: "url.domain:gaode.com", tags: [gaode, surface] }
  - { name: preprod_amap_ssr, query: "pre-amap-pc-ssr", tags: [amap, preprod] }
